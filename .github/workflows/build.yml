name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the release job can write (to publish releases).
permissions:
  contents: read

jobs:
  # Runs everywhere, including pull requests from forks, which get no secrets.
  # Debug builds compile without the AuthForge credentials.
  check:
    name: Check (frontend, clippy, tests)
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  # Official build with the AuthForge credentials. Never runs for pull
  # requests, so fork code never sees the secrets. On `v*` tags it also
  # publishes the release that razkom.com/tapt and the in-app update check use.
  release:
    name: Release build
    needs: check
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      AUTHFORGE_APP_ID: ${{ secrets.AUTHFORGE_APP_ID }}
      AUTHFORGE_APP_SECRET: ${{ secrets.AUTHFORGE_APP_SECRET }}
      AUTHFORGE_PUBLIC_KEY: ${{ secrets.AUTHFORGE_PUBLIC_KEY }}
      STRIPE_LIFETIME_URL: ${{ secrets.STRIPE_LIFETIME_URL }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      # A tag that doesn't match the app version would ship a build that
      # reports the wrong version, and installed copies would keep offering
      # an "update" to themselves.
      - name: Check tag matches app version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          for f in src-tauri/tauri.conf.json package.json; do
            v=$(node -p "require('./$f').version")
            if [ "v$v" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $v in $f"
              exit 1
            fi
          done
          cargo_v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "v$cargo_v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $cargo_v in src-tauri/Cargo.toml"
            exit 1
          fi

      - name: Write .env from CI secrets
        shell: bash
        run: |
          mkdir -p src-tauri
          cat <<EOF > src-tauri/.env
          AUTHFORGE_APP_ID=${AUTHFORGE_APP_ID}
          AUTHFORGE_APP_SECRET=${AUTHFORGE_APP_SECRET}
          AUTHFORGE_PUBLIC_KEY=${AUTHFORGE_PUBLIC_KEY}
          STRIPE_LIFETIME_URL=${STRIPE_LIFETIME_URL}
          EOF

      # Build only; publishing happens after the leak check below.
      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          includeRelease: true

      - name: Verify no plaintext secret leakage
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(find src-tauri/target -name 'tapt.exe' -type f | head -n1)
          if [ -z "$BIN" ]; then
            echo "::error::tapt.exe not found after the build"
            exit 1
          fi
          for name in AUTHFORGE_APP_ID AUTHFORGE_APP_SECRET; do
            value="${!name}"
            if [ -n "$value" ] && grep -aqF "$value" "$BIN"; then
              echo "::error::$name found as plaintext in $BIN"
              exit 1
            fi
          done
          echo "binary clean of known plaintext secrets"

      # The published release is what installed copies see as "Update
      # available" (version.rs reads this repo's latest release) and what the
      # razkom.com/tapt Download button serves (TaptSetup.exe).
      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected one NSIS installer, found ${#installers[@]}"
            exit 1
          fi
          cp "${installers[0]}" TaptSetup.exe

          # Release notes: the annotated tag's message (git tag -a), else the
          # tagged commit's message, plus the usual footer. actions/checkout
          # can turn annotated tags into lightweight ones, so refetch it.
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=""
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          fi
          [ -n "$notes" ] || notes=$(git log -1 --format=%B)
          {
            echo "$notes"
            echo
            echo "Free 1-hour trial built in. Buy a lifetime key at **[razkom.com/tapt](https://razkom.com/tapt)**."
          } > release-notes.md

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-run, or a leftover draft: replace the installer and publish it.
            gh release upload "$GITHUB_REF_NAME" TaptSetup.exe --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" TaptSetup.exe \
              --title "Tapt $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag \
              --latest
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tapt-windows-latest
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/*/release/bundle/**/*
          if-no-files-found: warn
