name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest

    env:
      AUTHFORGE_APP_ID: ${{ secrets.AUTHFORGE_APP_ID }}
      AUTHFORGE_APP_SECRET: ${{ secrets.AUTHFORGE_APP_SECRET }}
      AUTHFORGE_PUBLIC_KEY: ${{ secrets.AUTHFORGE_PUBLIC_KEY }}
      STRIPE_MONTHLY_URL: ${{ secrets.STRIPE_MONTHLY_URL }}
      STRIPE_LIFETIME_URL: ${{ secrets.STRIPE_LIFETIME_URL }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Write .env from CI secrets
        shell: bash
        run: |
          mkdir -p src-tauri
          cat <<EOF > src-tauri/.env
          AUTHFORGE_APP_ID=${AUTHFORGE_APP_ID}
          AUTHFORGE_APP_SECRET=${AUTHFORGE_APP_SECRET}
          AUTHFORGE_PUBLIC_KEY=${AUTHFORGE_PUBLIC_KEY}
          STRIPE_MONTHLY_URL=${STRIPE_MONTHLY_URL}
          STRIPE_LIFETIME_URL=${STRIPE_LIFETIME_URL}
          EOF

      # Build only here — release uploads are handled in the next step so installers
      # reliably appear under the GitHub Release (upload-artifact is Actions-only, not Releases).
      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          includeRelease: true

      - name: Attach NSIS installer to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "::error::No NSIS *-setup.exe under src-tauri/target/release/bundle/nsis/"
            find src-tauri/target/release/bundle -type f 2>/dev/null || true
            exit 1
          fi
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --draft \
              --title "${{ github.ref_name }}" \
              --notes "Tapt ${{ github.ref_name }}"
          fi
          gh release upload "${{ github.ref_name }}" "${installers[@]}" --clobber

      - name: Verify no plaintext secret leakage
        shell: bash
        run: |
          set -e
          BIN=$(find src-tauri/target -name 'tapt.exe' -type f | head -n1)
          if [ -z "$BIN" ]; then
            echo "binary not found; skipping leakage check"
            exit 0
          fi
          if [ -n "${AUTHFORGE_APP_ID}" ]; then
            if grep -aF "${AUTHFORGE_APP_ID}" "$BIN" > /dev/null 2>&1; then
              echo "::error::AUTHFORGE_APP_ID found as plaintext in $BIN"
              exit 1
            fi
          fi
          if [ -n "${AUTHFORGE_APP_SECRET}" ]; then
            if grep -aF "${AUTHFORGE_APP_SECRET}" "$BIN" > /dev/null 2>&1; then
              echo "::error::AUTHFORGE_APP_SECRET found as plaintext in $BIN"
              exit 1
            fi
          fi
          echo "binary clean of known plaintext secrets"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tapt-windows-latest
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/*/release/bundle/**/*
          if-no-files-found: warn
